[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "wsp-radiology-preparation"
version = "0.1.0"
description = "Reproducible Phase-1 data and model acquisition tooling"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.4,<13",
  "ImageHash>=4.3,<5",
  "requests>=2.32,<3",
  "numpy>=2,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
models = ["huggingface-hub>=0.26,<2"]
ml = ["torch==2.10.0", "torchvision==0.25.0", "transformers==5.2.0", "peft==0.18.1", "safetensors==0.7.0", "numpy==2.4.2", "scipy==1.17.0", "scikit-learn==1.8.0", "pandas==3.0.0"]
test = ["pytest>=8.3,<9", "scikit-learn>=1.5,<2"]

[project.scripts]
wsp-ml = "wsp_ml.cli:main"
wsp-prep = "wsp_prep.cli:main"
wsp-eval = "wsp_eval.cli:main"
wsp-harness = "wsp_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["infra", "src/wsp_eval", "src/wsp_harness", "src/wsp_ml", "src/wsp_prep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires Docker and an NVIDIA GPU"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
